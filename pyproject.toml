[project]
name = "skinguardai"
version = "1.0.0"
description = "SkinGuardAI: Deep Multi-Modal Dermoscopy Diagnostic Workstation with MedFusionNet"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pillow>=10,<13",
    "streamlit==1.59.2",
    "torch==2.14.0",
    "torchvision==0.29.0",
]

[project.optional-dependencies]
train = ["scikit-learn>=1.4,<2", "tqdm>=4.66,<5", "optuna>=4.0,<6"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
