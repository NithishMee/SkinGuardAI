services:
  - type: web
    name: skinguardai
    env: python
    region: oregon
    plan: free
    # Free remains opt-in demo hosting. For steady usage select 1c-2g or larger.
    buildCommand: pip install uv==0.11.29 && uv sync --frozen --no-dev
    startCommand: .venv/bin/streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SKINGUARD_CPU_THREADS
        value: "1"
